version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uadp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aidiscovery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uadp_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uadp_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/aidiscovery
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/aidiscovery
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_AI_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uadp_worker
    command: arq app.workers.worker.WorkerSettings
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/aidiscovery
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/aidiscovery
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_AI_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
